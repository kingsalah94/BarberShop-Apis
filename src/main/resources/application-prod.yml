# ════════════════════════════════════════════════════════════════════════════
#  PROFIL PROD — activé par SPRING_PROFILES_ACTIVE=prod (docker-compose).
#
#  Garde-fous :
#   - Base : DB_URL / DB_USERNAME / DB_PASSWORD SANS valeur par défaut →
#     l'application refuse de démarrer s'il en manque une.
#   - ddl-auto: validate imposé (JPA_DDL_AUTO ignoré) : Hibernate ne modifie
#     jamais le schéma, seules les migrations Flyway db/migration/V*.sql le font.
#   - Données de démo : seeders absents du profil prod (@Profile("!prod")),
#     même si APP_DEMO_DATA_ENABLED=true traîne dans le .env.
#   - Swagger / OpenAPI désactivés (surface d'attaque, cartographie de l'API).
# ════════════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  # Cookie du refresh token web : uniquement en HTTPS.
  auth:
    cookie-secure: true
  demo-data:
    enabled: false
  # Jamais de comptes *@test.local en production.
  test-users:
    enabled: false
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  show-actuator: false

server:
  # Derrière le proxy HTTPS (Caddy) : X-Forwarded-Proto/Host pris en compte →
  # URL des images = https://<domaine>/api/uploads/... et non http://api:8080.
  forward-headers-strategy: framework
  error:
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoint:
    health:
      show-details: never
  health:
    # Gmail indisponible ≠ API hors service (sinon /health = DOWN pour un souci d'e-mail).
    mail:
      enabled: false
